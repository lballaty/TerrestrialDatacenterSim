name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 1 * *"        # monthly, 1st 04:41 UTC — refresh carbon, IXP and (if changed) climate bundles
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate curated data (fails the build on a value without a source)
        run: python3 scripts/validate_curated.py data/jurisdictions.json data/power_options.json data/platforms.json data/models.json data/leadtimes.json

      - name: Recover previously published bundles (fallback if a source is down)
        continue-on-error: true
        run: |
          mkdir -p prev
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          for f in carbon ixp climate_grid hazard resources; do
            curl -fsSL "$base/$f.json" -o "prev/$f.json" || true
          done

      - name: Build carbon intensity bundle (Ember)
        run: python3 scripts/build_carbon.py site/data/carbon.json prev/carbon.json

      - name: Build internet exchange point set (PeeringDB)
        run: python3 scripts/build_ixp.py site/data/ixp.json prev/ixp.json

      - name: Build climate grid (ERA5 via Copernicus CDS; needs CDS_TOKEN secret, else keeps previous)
        env:
          CDS_TOKEN: ${{ secrets.CDS_TOKEN }}
        run: python3 scripts/build_climate_grid.py site/data/climate_grid.json prev/climate_grid.json

      - name: Assemble site
        run: |
          mkdir -p site/data
          cp index.html site/
          cp terrestrial_datacenter_model_specification.md site/
          cp README.md site/ 2>/dev/null || true
          cp data/*.json site/data/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
